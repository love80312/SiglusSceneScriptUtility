
name: Build Windows 10 x64

on:
  workflow_dispatch:

  push:
    branches:
      - _fix_01

  pull_request:
    branches:
      - _fix_01

permissions:
  contents: read

concurrency:
  group: build-windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 Portable
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Python build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          python -m pip install `
            maturin==1.16.0 `
            pyinstaller==6.22.3 `
            pillow==13.0.0 `
            psutil==7.2.2 `
            ruff==0.17.3

      - name: Check Python syntax
        shell: pwsh
        run: |
          python -m compileall -q src/siglus_ssu scripts

      - name: Python lint
        shell: pwsh
        run: |
          ruff check .

      - name: Rust format check
        shell: pwsh
        run: |
          cargo fmt --manifest-path src/siglus_ssu/rust/Cargo.toml -- --check

      - name: Rust Clippy
        shell: pwsh
        run: |
          cargo clippy --manifest-path src/siglus_ssu/rust/Cargo.toml --locked -- -D warnings

      - name: Build native Python wheel
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\wheel" | Out-Null

          maturin build --release --locked --interpreter python --out "dist\wheel"

          if ($LASTEXITCODE -ne 0) {
            throw "Maturin build failed."
          }

          $wheel = Get-ChildItem -Path "dist\wheel" -Filter "*.whl" |
            Select-Object -First 1

          if ($null -eq $wheel) {
            throw "Maturin did not produce a wheel."
          }

          python -m pip install --no-deps $wheel.FullName

          if ($LASTEXITCODE -ne 0) {
            throw "Installing the native wheel failed."
          }

      - name: Verify native extension
        shell: pwsh
        run: |
          python -c "from siglus_ssu.native_ops import is_native_available; assert is_native_available(), 'Rust native extension unavailable'; print('Rust native extension: OK')"

          if ($LASTEXITCODE -ne 0) {
            throw "Rust native extension verification failed."
          }

      - name: Create PyInstaller entry point
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build" | Out-Null

          @'
          import multiprocessing
          import sys

          if __name__ == "__main__":
              multiprocessing.freeze_support()

              if sys.argv[1:] == ["--_native-smoke-test"]:
                  import psutil
                  from PIL import Image
                  from siglus_ssu.native_ops import is_native_available

                  if not is_native_available():
                      raise SystemExit("Rust native extension was not loaded")

                  Image.new("RGBA", (1, 1)).close()
                  psutil.cpu_count()

                  print("Native extension, Pillow, and psutil: OK")
                  raise SystemExit(0)

              from siglus_ssu.__main__ import main
              raise SystemExit(main())
          '@ | Set-Content -LiteralPath "build\pyinstaller_entry.py" -Encoding utf8

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --console `
            --name siglus-ssu `
            --collect-all siglus_ssu `
            --collect-all PIL `
            --collect-all psutil `
            --copy-metadata siglus-ssu `
            --hidden-import siglus_ssu.native_accel `
            build\pyinstaller_entry.py

          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller build failed."
          }

      - name: Smoke test Windows executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\siglus-ssu\siglus-ssu.exe"

          if (-not (Test-Path $exe)) {
            throw "Executable was not found: $exe"
          }

          & $exe --_native-smoke-test

          if ($LASTEXITCODE -ne 0) {
            throw "Frozen native extension smoke test failed."
          }

          & $exe --version

          if ($LASTEXITCODE -ne 0) {
            throw "Version test failed."
          }

          & $exe --help | Out-Null

          if ($LASTEXITCODE -ne 0) {
            throw "Help test failed."
          }

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: siglus-ssu-windows-x64
          path: dist/siglus-ssu/
          if-no-files-found: error
          retention-days: 30
